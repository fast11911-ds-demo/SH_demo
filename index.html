<script>
    // [설정값]
    const CLIENT_ID = "62fe74d2-f89f-4842-b255-17c3b9c4a117"; 
    const ACCOUNT_ID = "61c279f3-3001-436e-9c14-e453cb09f1b3";
    const REDIRECT_URI = window.location.href.split('#')[0]; 
    const ENVIRONMENT = "account-d.docusign.com"; 

    let accessToken = null;

    window.onload = function() {
        const hash = window.location.hash.substring(1);
        const params = new URLSearchParams(hash);
        if (params.has("access_token")) {
            accessToken = params.get("access_token");
            document.getElementById('auth-status').innerText = "✅ 로그인 성공! (Token 확보됨)";
            document.getElementById('auth-status').style.color = "var(--ds-success)";
            document.getElementById('loginBtn').style.display = "none";
            document.getElementById('uploadSection').style.display = "block";
            window.history.replaceState(null, null, window.location.pathname);
        }
    };

    function loginWithDocuSign() {
        const scope = "signature adm_store_unified_repo_read adm_store_unified_repo_write models_read document_uploader_read document_uploader_write public_dms_document_read"; 
        const authUrl = `https://${ENVIRONMENT}/oauth/auth?response_type=token&client_id=${CLIENT_ID}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}&scope=${encodeURIComponent(scope)}`;
        window.location.href = authUrl; 
    }

    function generateJobName() {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        const randomStr = String(Math.floor(Math.random() * 10000)).padStart(4, '0');
        return `${yyyy}${mm}${dd}${randomStr}`;
    }

    let selectedFiles = [];
    function triggerFileInput() { document.getElementById('fileInput').click(); }
    function handleFileSelect(event) {
        selectedFiles = Array.from(event.target.files);
        const fileListElement = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');
        fileListElement.innerHTML = '';
        if (selectedFiles.length > 0) {
            selectedFiles.forEach(file => {
                const li = document.createElement('li');
                li.innerHTML = `<span>📄 ${file.name}</span>`;
                fileListElement.appendChild(li);
            });
            submitBtn.style.display = 'block';
        } else {
            submitBtn.style.display = 'none';
        }
    }

    function logToScreen(message) {
        const logBox = document.getElementById('logBox');
        logBox.style.display = 'block';
        logBox.innerHTML += message + "\n";
    }

    // 💡 파일을 서버리스 함수로 보내기 위해 텍스트(Base64)로 변환해주는 헬퍼 함수
    const convertFileToBase64 = (file) => new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = (error) => reject(error);
    });

    async function handleSubmit() {
        if (!accessToken) { alert("토큰이 없습니다."); return; }
        if (selectedFiles.length === 0) return;

        const submitBtn = document.getElementById('submitBtn');
        submitBtn.disabled = true;
        submitBtn.innerText = "Processing...";
        const logBox = document.getElementById('logBox');
        logBox.innerHTML = ""; 
        logBox.style.display = 'block';

        try {
            // ==========================================================
            // [Step 1] Bulk Upload Job 생성
            // ==========================================================
            const jobName = generateJobName();
            const expectedNumber = selectedFiles.length; 
            
            logToScreen(`[Step 1] Job 생성 요청 중... (파일명: ${jobName})`);

            const step1Url = `/api/createJob`; 
            const step1Options = {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    token: accessToken,
                    accountId: ACCOUNT_ID,
                    bodyData: {
                        "agreement_set_ids": [],
                        "expected_number_of_docs": expectedNumber,
                        "job_name": jobName,
                        "language": "en-US"
                    }
                })
            };
            
            const response1 = await fetch(step1Url, step1Options);
            const result1 = await response1.json();
            
            const createdJobId = result1.id;
            let uploadUrls = [];
            if (result1._embedded && result1._embedded.documents) {
                uploadUrls = result1._embedded.documents.map(doc => doc._actions.upload_document);
            }

            if (!createdJobId || uploadUrls.length === 0) {
                throw new Error("Job ID 또는 업로드 URL을 추출하지 못했습니다.");
            }

            logToScreen(`✅ [Step 1 완료] Job ID: ${createdJobId}`);
            
            // ==========================================================
            // [Step 2] Vercel 프록시를 경유하여 파일 업로드
            // ==========================================================
            logToScreen(`\n[Step 2] 문서 실물 업로드 시작 (Vercel 우회) ...`);

            for (let i = 0; i < selectedFiles.length; i++) {
                const file = selectedFiles[i];
                const uploadUrl = uploadUrls[i]; 

                if (!uploadUrl) {
                    logToScreen(`⚠️ ${file.name}에 대응하는 업로드 URL이 없습니다.`);
                    continue;
                }

                logToScreen(` ⏳ [${i+1}/${selectedFiles.length}] 전송 중: ${file.name}`);

                // 파일을 Vercel이 이해할 수 있게 Base64 텍스트로 변환
                const base64Data = await convertFileToBase64(file);

                // 방금 만든 내 Vercel API('/api/upload')로 전송
                const putResponse = await fetch('/api/upload', {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        uploadUrl: uploadUrl,
                        fileName: file.name,
                        fileType: file.type,
                        fileBase64: base64Data
                    })
                });

                if (!putResponse.ok) {
                    const errorJson = await putResponse.json();
                    throw new Error(`${file.name} 업로드 실패 (HTTP ${putResponse.status}) - ${errorJson.details || errorJson.error}`);
                }

                logToScreen(` ✅ 성공: ${file.name}`);
            }

            logToScreen(`\n🎉 [Step 2 완료] 모든 문서가 클라우드에 전송되었습니다!`);
            logToScreen(`\n--> 최종 승인(Step 3) 단계를 대기 중입니다...`);

            window.currentJobId = createdJobId;

        } catch (error) {
            console.error("API Error:", error);
            logToScreen(`\n❌ [에러 발생] ${error.message}`);
        } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Submit";
        }
    }
</script>
